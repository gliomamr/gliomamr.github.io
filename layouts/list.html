{{ define "main" }}

<header>

  {{ with .Params.banner }}
<div class="page-banner">
  <img src="{{ . }}">
</div>
  {{ end }}

  </div>

  <h1 class="mt-0 text-4xl font-extrabold text-neutral-900 dark:text-neutral">
    {{ .Title }}
  </h1>

</header>

<section class="prose flex max-w-full flex-col dark:prose-invert">
  <div style="
    max-width: 1000px;
    margin: 0 auto;
    text-align: left;"
  >
    {{ .Content | emojify }}
  </div>
</section>

{{ end }}
